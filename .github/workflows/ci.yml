name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Backstop for anything a per-test timeout can't catch (a hung install or
    # collection): fail in minutes, never run to GitHub's 6h job ceiling.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    # Tests that need a tool beyond the Python packages skip when it is
    # missing, which is right on a developer's machine and wrong here: the leg
    # that was meant to run them would skip them and still report success.
    # Setting a variable is this leg promising the tool, and turns "missing,
    # skip" into "missing, fail". The Linux leg installs them all and promises
    # them; the Windows leg promises nothing, which says out loud that it does
    # not run those tests. Everything behind these is OS-independent, so
    # covering it once is enough. See tests/gates.py.
    env:
      OPENAVC_REQUIRE_NODE: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
      OPENAVC_REQUIRE_DRIVER_CORPUS: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
      OPENAVC_REQUIRE_BASH: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
      OPENAVC_REQUIRE_OPENSSL: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
      OPENAVC_REQUIRE_GIT: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[test]"

      # Dozens of test files bundle the real TypeScript sources with esbuild and
      # run them under Node, so they need openavc/web/programmer/node_modules. This job
      # used to install Python only, and every one of those tests skipped.
      - name: Set up Node.js
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Programmer UI dependencies
        if: matrix.os == 'ubuntu-latest'
        working-directory: openavc/web/programmer
        run: npm ci

      # The driver-library sweeps assert a platform property over every shipped
      # driver, so they need the library itself. Clone it outside the checkout:
      # inside, its 24 drivers that import from openavc.transport would be swept
      # up by the tests that walk this repo's source tree. Track main rather
      # than a pin — a genuine disagreement between the platform and the
      # shipped drivers should go red here.
      - name: Clone the community driver library
        if: matrix.os == 'ubuntu-latest'
        run: git clone --depth 1 https://github.com/open-avc/openavc-drivers.git "$RUNNER_TEMP/openavc-drivers"

      - name: Lint with ruff
        run: ruff check openavc/ tests/

      - name: Run tests
        # tests/perf holds wall-clock benchmarks that are unreliable on shared
        # CI runners; run them on demand with `pytest tests/perf`, not in the gate.
        env:
          OPENAVC_DRIVERS_ROOT: ${{ runner.temp }}/openavc-drivers
        run: pytest tests/ -v --tb=short --ignore=tests/perf

      # The browser tests boot a real server and drive the Programmer IDE in
      # Chromium — the only automated proof the IDE works in a browser. They
      # need three things the run above does not: the Playwright package, an
      # actual browser, and a built IDE (the server serves openavc/web/programmer/dist,
      # so with no build every page 404s and all of them fail). Installed after
      # the unit run so that gate's environment stays exactly as it was.
      - name: Install the browser test stack
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium

      - name: Build the Programmer UI for the browser tests
        if: matrix.os == 'ubuntu-latest'
        working-directory: openavc/web/programmer
        run: npm run build

      # A separate step on purpose, never folded into the run above: the
      # Playwright plugin drives a synchronous event loop that collides with
      # pytest-asyncio and poisons the async suite, which is why pyproject
      # excludes tests/e2e from every default run. Clearing addopts re-enables
      # the plugin for this step alone. OPENAVC_REQUIRE_E2E is this leg
      # promising Playwright: without it, a missing install would collect
      # nothing and still report success.
      - name: Run browser tests
        if: matrix.os == 'ubuntu-latest'
        env:
          OPENAVC_REQUIRE_E2E: "1"
        run: pytest tests/e2e -o addopts="" -v --tb=short

  build-frontend:
    name: Build frontends
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and build Programmer UI
        working-directory: openavc/web/programmer
        run: |
          npm ci
          npm run build

      - name: Test Programmer UI
        working-directory: openavc/web/programmer
        run: npm run test

      - name: Install and build Simulator UI
        working-directory: openavc/web/simulator
        run: |
          npm ci
          npm run build

      - name: Test Simulator UI
        working-directory: openavc/web/simulator
        run: npm run test

  wheel-smoke:
    name: Wheel smoke (built wheel serves the UI)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The wheel bundles the built web assets. A wheel built from a tree that
      # was never `npm run build`-ed installs fine but ships no UI, so build the
      # frontends before packaging.
      - name: Build Programmer UI
        working-directory: openavc/web/programmer
        run: |
          npm ci
          npm run build

      - name: Build Simulator UI
        working-directory: openavc/web/simulator
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install the wheel into a clean venv
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-venv"
          "${RUNNER_TEMP}/wheel-venv/bin/pip" install --upgrade pip
          "${RUNNER_TEMP}/wheel-venv/bin/pip" install dist/*.whl

      - name: Smoke — the installed wheel bundles and serves the UI
        env:
          # Keep the started server's seeded projects out of the checkout.
          OPENAVC_DATA_DIR: ${{ runner.temp }}/openavc-data
        run: |
          "${RUNNER_TEMP}/wheel-venv/bin/python" .github/scripts/wheel_smoke.py
