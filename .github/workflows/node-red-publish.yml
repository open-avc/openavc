# STAGES the Node-RED package (integrations/node-red) on npm when a
# node-red-v<version> tag is pushed. Staged, not published: the version sits
# on npmjs.com until a person clicks Publish on the package's page, so every
# release keeps a human gate and nothing this workflow (or anyone holding it)
# does can put a version in front of the world on its own. That is npm's
# recommended posture for trusted publishers, and the package's settings
# there allow staging only.
#
# The tag's version must match the package.json version, so a tag can never
# stage a number nobody bumped. No token is stored anywhere: npm trusts this
# workflow by name (repository open-avc/openavc, file node-red-publish.yml)
# through GitHub's OIDC token, which is what `id-token: write` grants.
# Provenance is attached automatically for a public package from a public
# repo.
#
# Deliberately a separate tag family from the platform's v* release tags:
# the package has its own version and its own cadence.
name: Publish Node-RED package

on:
  push:
    tags:
      - "node-red-v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Stage @open-avc/node-red-openavc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: integrations/node-red

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: The tag names the version package.json carries
        run: |
          tag_version="${GITHUB_REF_NAME#node-red-v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "tag says $tag_version, package.json says $pkg_version -- bump one of them" >&2
            exit 1
          fi

      # `npm stage` is new in npm 11; the runner's bundled npm may predate it.
      - name: Use an npm that knows how to stage
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install and test
        run: |
          npm ci
          npm test

      - name: Stage on npm (a person publishes it from npmjs.com)
        run: npm stage publish --access public
