name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: write
  contents: write
  packages: write

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  security:
    name: Verify CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/codeql-gate
        with:
          sha: ${{ github.sha }}
          languages: actions,python,javascript-typescript
        env:
          GH_TOKEN: ${{ github.token }}

  # ── Gate: run full test suite before building anything ──────────────
  # The same promises and the same steps as ci.yml's test job, held equal by
  # tests/test_release_tests_match_ci.py. A test that needs a tool beyond the
  # Python packages skips when it is missing unless the run promises the tool
  # (tests/gates.py), so a gate that promised nothing would pass with those
  # tests skipped. The macOS leg runs what needs no promise.
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    # What each promise means, and why each leg promises what it does: the
    # comment above this block in ci.yml.
    env:
      OPENAVC_REQUIRE_NODE: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
      OPENAVC_REQUIRE_DRIVER_CORPUS: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
      OPENAVC_REQUIRE_BASH: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
      OPENAVC_REQUIRE_OPENSSL: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
      OPENAVC_REQUIRE_GIT: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
      OPENAVC_REQUIRE_LATEST_RELEASE: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
      OPENAVC_REQUIRE_SYMLINKS: "1"
      OPENAVC_REQUIRE_HOST_FIREWALL: ${{ matrix.os == 'windows-latest' && '1' || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[test]"

      # Dozens of test files bundle the real TypeScript sources with esbuild and
      # run them under Node, so they need openavc/web/programmer/node_modules. This job
      # used to install Python only, and every one of those tests skipped.
      - name: Set up Node.js
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Programmer UI dependencies
        if: matrix.os == 'ubuntu-latest'
        working-directory: openavc/web/programmer
        run: npm ci

      # The driver-library sweeps assert a platform property over every shipped
      # driver, so they need the library itself. Clone it outside the checkout:
      # inside, its 24 drivers that import from openavc.transport would be swept
      # up by the tests that walk this repo's source tree. Track main rather
      # than a pin — a genuine disagreement between the platform and the
      # shipped drivers should go red here.
      - name: Clone the community driver library
        if: matrix.os == 'ubuntu-latest'
        run: git clone --depth 1 https://github.com/open-avc/openavc-drivers.git "$RUNNER_TEMP/openavc-drivers"

      # The uninstaller's [Code] is compiled and run against real firewall
      # rules by tests/test_windows_firewall_live.py; release.yml installs the
      # same compiler to build the installer.
      - name: Install Inno Setup
        if: matrix.os == 'windows-latest'
        run: choco install innosetup -y --no-progress

      # A Windows update runs its installer only when it is signed by OpenAVC
      # LLC (openavc/updater/installer_signature.py). The tests prove the
      # refusals with someone else's signed program; this proves the check
      # accepts a real OpenAVC installer, the latest release's, and refuses a
      # copy of it with one byte changed. Its certificate has usually expired
      # (they last three days), so this also proves the signing timestamp is
      # honored. Red here means every Windows install on this code would
      # refuse its next update.
      - name: Check the updater accepts the latest release's installer
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'installer-check'
          New-Item -ItemType Directory -Force $d | Out-Null
          gh release download -R open-avc/openavc -p 'OpenAVC-Setup-*.exe' -D $d
          $exe = (Get-ChildItem $d -Filter 'OpenAVC-Setup-*.exe' | Select-Object -First 1).FullName
          python -m openavc.updater.installer_signature $exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $b = [IO.File]::ReadAllBytes($exe); $b[1000000] = $b[1000000] -bxor 0xFF
          $tampered = Join-Path $d 'tampered.exe'
          [IO.File]::WriteAllBytes($tampered, $b)
          $out = python -m openavc.updater.installer_signature $tampered
          $out
          if ($LASTEXITCODE -ne 1 -or -not ($out -match 'changed after it was signed')) { exit 1 }
          exit 0

      # An installed system applies an update with the script its own release
      # carries, not the one inside the update, so
      # tests/test_update_from_latest_release.py runs the latest release's
      # update helper and macOS wrapper against what this commit builds. The
      # checkout has no tags: fetch that release's, and name it for the test.
      - name: Fetch the latest release's tag
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view -R open-avc/openavc --json tagName -q .tagName)
          [[ "$tag" =~ ^v[0-9] ]] || { echo "No latest release found (got '$tag')"; exit 1; }
          git fetch --no-tags --depth=1 origin "+refs/tags/$tag:refs/tags/$tag"
          echo "OPENAVC_LATEST_RELEASE=$tag" >> "$GITHUB_ENV"

      - name: Lint with ruff
        run: ruff check openavc/ tests/

      - name: Run tests
        # tests/perf holds wall-clock benchmarks that are unreliable on shared
        # CI runners; run them on demand with `pytest tests/perf`, not in the gate.
        # -n auto: one pytest-xdist worker per runner core; --dist loadgroup keeps
        # each test file on one worker (tests/conftest.py says why).
        env:
          OPENAVC_DRIVERS_ROOT: ${{ runner.temp }}/openavc-drivers
        run: pytest tests/ -n auto --dist loadgroup -v --tb=short --ignore=tests/perf

  # ── Extract version from tag ────────────────────────────────────────
  version:
    name: Extract version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          # Fails the release on a tag that is not a version OpenAVC reads or
          # that differs from pyproject.toml's version, and says whether it is
          # a pre-release by the version rule (installer/release-version.py).
          OUTPUTS=$(python3 installer/release-version.py "$TAG") || { echo "$OUTPUTS"; exit 1; }
          echo "$OUTPUTS" >> "$GITHUB_OUTPUT"

  # ── Windows installer (.exe) ────────────────────────────────────────
  windows:
    name: Windows installer
    needs: [test, version, security]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SIGNING_ENABLED: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Programmer UI
        working-directory: openavc/web/programmer
        run: |
          npm ci
          npm run build

      - name: Build Simulator UI
        working-directory: openavc/web/simulator
        run: |
          npm ci
          npm run build

      - name: Install Python build deps
        run: pip install pyinstaller infi.systray -r requirements.txt

      - name: Bundle server with PyInstaller
        run: pyinstaller installer/openavc.spec --noconfirm --clean

      - name: Sign server executable
        if: env.SIGNING_ENABLED != ''
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: openavc
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          files-folder: dist/openavc
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Bundle tray app with PyInstaller
        run: pyinstaller installer/tray.spec --noconfirm --clean

      - name: Sign tray executable
        if: env.SIGNING_ENABLED != ''
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: openavc
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          files-folder: dist/openavc-tray
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: iscc /DMyAppVersion=${{ env.VERSION }} installer/setup.iss

      - name: Sign installer
        if: env.SIGNING_ENABLED != ''
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: openavc
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          files-folder: dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # An installed Windows system refuses an update whose installer is not
      # signed by OpenAVC LLC (openavc/updater/installer_signature.py). The same
      # check runs here, so a release that every Windows install would refuse
      # fails before it is published.
      - name: Check the updater accepts the installer
        if: env.SIGNING_ENABLED != ''
        run: python -m openavc.updater.installer_signature dist/OpenAVC-Setup-${{ env.VERSION }}.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/OpenAVC-Setup-*.exe

  # ── macOS installer (.pkg) ─────────────────────────────────────────
  # One native build per arch (macos-15 = Apple Silicon, macos-15-intel = Intel).
  # Signing + notarization gate on APPLE_TEAM_ID; with no Apple secrets the job
  # still produces a working *unsigned* .pkg (pre-enrollment / fork builds).
  macos:
    name: macOS installer (${{ matrix.arch }})
    needs: [test, version, security]
    runs-on: ${{ matrix.runner }}
    # Backstop against a stalled Apple-service call hanging the job for
    # GitHub's 6-hour default. The productbuild key-auth hang that bit
    # v0.22.0 is fixed at its source (keys imported with -A, below), so
    # build + signing now run in minutes. The one stage that can still
    # legitimately take hours is notarization: Apple's deep analysis
    # (common for an early Developer ID submission) held the first local
    # one ~2h. This cap must clear that, so it only ever kills a truly
    # infinite hang, never a slow-but-succeeding notarization.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SIGNING_ENABLED: ${{ secrets.APPLE_TEAM_ID }}
      # The Apple Silicon runner (macos-15, ~7 GB) sizes Node's heap lower than
      # the 16 GB Linux/Windows runners, so the Vite production build of the
      # Programmer UI hit the ~2 GB default ceiling and aborted (OOM, exit 134).
      # Give Node room; this fits comfortably in the runner's memory.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Programmer UI
        working-directory: openavc/web/programmer
        run: |
          npm ci
          npm run build

      - name: Build Simulator UI
        working-directory: openavc/web/simulator
        run: |
          npm ci
          npm run build

      - name: Install Python build deps
        run: pip install pyinstaller rumps -r requirements.txt

      - name: Import signing certificates
        if: env.SIGNING_ENABLED != ''
        env:
          APPLE_APP_CERT_P12_BASE64: ${{ secrets.APPLE_APP_CERT_P12_BASE64 }}
          APPLE_INSTALLER_CERT_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERT_P12_BASE64 }}
          APPLE_CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/openavc-signing.keychain-db"
          KEYCHAIN_PWD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          echo "$APPLE_APP_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/app.p12"
          echo "$APPLE_INSTALLER_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/installer.p12"
          # Import with -A (any app may use the key without prompting), NOT
          # -T <tool>. The -T ACL form makes securityd evaluate an app-list
          # authorization when the key is used, and on a headless runner that
          # evaluation blocks forever: productbuild hung in securityd's
          # generateSignature the first time this signed path ran in CI
          # (v0.22.0), sampled parking 100% in SecKeyCreateSignature -> mach_msg.
          # The keychain is ephemeral and dies with the runner, so unrestricted
          # key access here carries no lasting exposure. A trivial-pkg probe
          # confirmed -A signs in 0.66s where -T hung past 4 hours.
          security import "$RUNNER_TEMP/app.p12" -k "$KEYCHAIN" -P "$APPLE_CERT_P12_PASSWORD" -A
          security import "$RUNNER_TEMP/installer.p12" -k "$KEYCHAIN" -P "$APPLE_CERT_P12_PASSWORD" -A
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" > /dev/null
          # Make our keychain the default and first in the search list so
          # codesign/productbuild find the identity.
          security default-keychain -d user -s "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"

      - name: Write notarization key
        if: env.SIGNING_ENABLED != ''
        run: echo "${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}" | base64 -d > "$RUNNER_TEMP/notary.p8"

      - name: Build .pkg + update tarball
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SIGNING_IDENTITY: ${{ secrets.APPLE_APP_SIGNING_IDENTITY }}
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_PATH: ${{ runner.temp }}/notary.p8
        run: bash installer/build-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/OpenAVC-*-macos-*.pkg
            dist/openavc-*-macos-*.tar.gz

  # ── Linux archive (amd64) ──────────────────────────────────────────
  linux-amd64:
    name: Linux archive (amd64)
    needs: [test, version, security]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Programmer UI
        working-directory: openavc/web/programmer
        run: |
          npm ci
          npm run build

      - name: Build Simulator UI
        working-directory: openavc/web/simulator
        run: |
          npm ci
          npm run build

      - name: Create archive
        run: |
          mkdir -p projects/default
          ARCHIVE="openavc-${VERSION}-linux-amd64.tar.gz"
          tar czf "$ARCHIVE" \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='tests' \
            --exclude='.pytest_cache' \
            --exclude='.ruff_cache' \
            --exclude='installer/pi-image/pi-gen' \
            --exclude='openavc/web/programmer/node_modules' \
            --exclude='openavc/web/programmer/src' \
            --exclude='openavc/web/programmer/.env*' \
            --exclude='openavc/web/simulator/node_modules' \
            --exclude='openavc/web/simulator/src' \
            --exclude='openavc/web/simulator/.env*' \
            openavc/ \
            installer/openavc.service \
            installer/update-helper.sh \
            installer/apply-lib.sh \
            installer/firewall-sync.sh \
            installer/openavc-privileged-helper.sh \
            installer/trusted-keys/ \
            requirements.txt \
            pyproject.toml \
            LICENSE
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: openavc-*-linux-amd64.tar.gz

  # ── Linux archive (arm64) ──────────────────────────────────────────
  linux-arm64:
    name: Linux archive (arm64)
    needs: [test, version, security]
    runs-on: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Programmer UI
        working-directory: openavc/web/programmer
        run: |
          npm ci
          npm run build

      - name: Build Simulator UI
        working-directory: openavc/web/simulator
        run: |
          npm ci
          npm run build

      - name: Create archive
        run: |
          mkdir -p projects/default
          ARCHIVE="openavc-${VERSION}-linux-arm64.tar.gz"
          tar czf "$ARCHIVE" \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='tests' \
            --exclude='.pytest_cache' \
            --exclude='.ruff_cache' \
            --exclude='installer/pi-image/pi-gen' \
            --exclude='openavc/web/programmer/node_modules' \
            --exclude='openavc/web/programmer/src' \
            --exclude='openavc/web/programmer/.env*' \
            --exclude='openavc/web/simulator/node_modules' \
            --exclude='openavc/web/simulator/src' \
            --exclude='openavc/web/simulator/.env*' \
            openavc/ \
            installer/openavc.service \
            installer/update-helper.sh \
            installer/apply-lib.sh \
            installer/firewall-sync.sh \
            installer/openavc-privileged-helper.sh \
            installer/trusted-keys/ \
            requirements.txt \
            pyproject.toml \
            LICENSE
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: openavc-*-linux-arm64.tar.gz

  # ── Docker image (multi-arch) ──────────────────────────────────────
  docker:
    name: Docker image
    needs: [test, version, security]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        if: ${{ vars.DOCKERHUB_ENABLED == 'true' }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Docker tags
        id: tags
        run: |
          GHCR="ghcr.io/${{ github.repository_owner }}/openavc"
          TAGS="${GHCR}:${VERSION}"
          # Only a stable release is tagged :latest (the version job decides)
          if [ "$PRERELEASE" = "false" ]; then
            TAGS="${TAGS},${GHCR}:latest"
          fi
          # Add Docker Hub tags if configured
          if [ "${{ vars.DOCKERHUB_ENABLED }}" = "true" ]; then
            TAGS="${TAGS},openavc/openavc:${VERSION}"
            if [ "$PRERELEASE" = "false" ]; then
              TAGS="${TAGS},openavc/openavc:latest"
            fi
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Every program an OpenAVC transport runs has to be in the image: the SSH
      # client was once left out and no SSH device could connect in Docker.
      # Checked on the image just published, the way a user pulls it.
      - name: Check the published image has every transport program
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/openavc:${VERSION}"
          docker run --rm --entrypoint python "$IMAGE" -c "import sys; from openavc.system.os_programs import missing_programs; m = [p.command for p in missing_programs()]; print('missing transport programs:', m); sys.exit(1 if m else 0)"
          docker run --rm --entrypoint ssh "$IMAGE" -V

  # ── Create GitHub Release ──────────────────────────────────────────
  release:
    name: Create release
    needs: [version, windows, macos, linux-amd64, linux-arm64, docker]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Presence of the signing key arms artifact signing. Absent (forks,
      # pre-enrollment) → the signing step is skipped and the release ships
      # unsigned, which the client verifiers treat as "not armed" (warn, don't
      # brick). Mirrors how the Azure/Apple signing steps gate on their secrets.
      SIGNING_KEY_SET: ${{ secrets.RELEASE_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release/
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: release/
      - uses: actions/download-artifact@v4
        with:
          name: macos-x86_64
          path: release/
      - uses: actions/download-artifact@v4
        with:
          name: linux-amd64
          path: release/
      - uses: actions/download-artifact@v4
        with:
          name: linux-arm64
          path: release/

      - name: List release files
        run: ls -lh release/

      - name: Generate checksums
        working-directory: release
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Detached EC P-256 signatures over every downloadable file (tarballs +
      # SHA256SUMS.txt + the installers). "Everything you download has a .sig;
      # verify it against the trusted public key." The Linux tarball's own .sig
      # is the authoritative gate for the root update-helper (it can't trust the
      # service-user-writable checksums channel); SHA256SUMS.txt.sig covers the
      # install.sh path. openssl dgst -verify (openssl 1.1.1 + 3.x) is the
      # verifier — no extra binary to ship, and the root helper can't use the
      # venv it's replacing. Windows/macOS installers are OS-signed (the Windows
      # updater checks the installer's Authenticode signature, not its .sig) but
      # get a .sig too for a uniform model. `files: release/*` uploads the .sig
      # siblings automatically.
      - name: Sign release artifacts
        if: env.SIGNING_KEY_SET != ''
        working-directory: release
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/release-signing.key"
          ( umask 077; echo "$RELEASE_SIGNING_KEY" | base64 -d > "$KEY" )
          for f in *; do
            case "$f" in *.sig) continue ;; esac
            [ -f "$f" ] || continue
            openssl dgst -sha256 -sign "$KEY" -out "$f.sig" "$f"
            echo "signed $f -> $f.sig"
          done
          shred -u "$KEY" 2>/dev/null || rm -f "$KEY"
          ls -l

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: OpenAVC v${{ env.VERSION }}
          draft: false
          prerelease: ${{ needs.version.outputs.prerelease }}
          body_path: .github/RELEASE_NOTES.md
          files: release/*

      - name: Trigger Pi image build
        if: ${{ needs.version.outputs.prerelease == 'false' }}
        continue-on-error: true
        run: gh workflow run release-pi.yml --ref "v$VERSION" -f "tag=v$VERSION"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger marketing site rebuild
        if: ${{ needs.version.outputs.prerelease == 'false' }}
        run: |
          # --fail matters here. Plain `curl -s` exits 0 on a 404, so a hook URL
          # that was rotated, revoked, or pointed at a deleted site reports
          # success forever while openavc.com keeps serving the previous release.
          if [ -z "$SITE_DEPLOY_HOOK" ]; then
            echo "SITE_DEPLOY_HOOK is not set, so openavc.com keeps serving the previous release." >&2
            exit 1
          fi
          curl -sS --fail-with-body -X POST "$SITE_DEPLOY_HOOK" \
            -w '\nbuild hook responded %{http_code}\n'
        env:
          SITE_DEPLOY_HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}

      - name: Notify Discord
        if: ${{ needs.version.outputs.prerelease == 'false' }}
        run: |
          DOWNLOAD_URL="https://openavc.com/download"
          # Character-aware truncation: jq -Rs reads the file as one raw string
          # and .[0:4000] slices by codepoint, so we never cut a multibyte UTF-8
          # char mid-sequence (head -c truncates by bytes and can emit invalid
          # UTF-8 that breaks the JSON). One encode pass, no decode/re-encode.
          EMBED_DESC_JSON=$(jq -Rs '.[0:4000]' < .github/RELEASE_NOTES.md)
          jq -n --arg title "OpenAVC v${VERSION} Released" \
                --arg url "$DOWNLOAD_URL" \
                --argjson color 5682323 \
                --argjson desc "$EMBED_DESC_JSON" \
                '{embeds: [{title: $title, url: $url, color: $color, description: ($desc + "\n\n[Download](https://openavc.com/download)")}]}' \
          | curl -s -H "Content-Type: application/json" -d @- "${{ secrets.DISCORD_WEBHOOK }}"
