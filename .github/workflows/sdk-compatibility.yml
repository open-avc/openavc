name: Manufacturer SDK compatibility

on:
  push:
    paths:
      - 'openavc/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '.github/workflows/sdk-compatibility.yml'
  pull_request:
    paths:
      - 'openavc/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '.github/workflows/sdk-compatibility.yml'
  workflow_dispatch:
    inputs:
      sdk-ref:
        description: SDK revision to compare with this core revision
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: sdk-compatibility-${{ github.ref }}-${{ inputs.sdk-ref || 'main' }}
  cancel-in-progress: true

jobs:
  sdk:
    uses: open-avc/openavc-sdk/.github/workflows/compatibility.yml@bfd0275185ef7a74f2d83f0123e1a6c1f5a3db85
    with:
      core-ref: ${{ github.sha }}
      sdk-ref: ${{ inputs.sdk-ref || 'main' }}
