name: Trigger marketing site rebuild

on:
  workflow_dispatch:

jobs:
  rebuild:
    name: Rebuild openavc.com
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build hook
        run: |
          # --fail matters here. Plain `curl -s` exits 0 on a 404, so a hook URL
          # that was rotated, revoked, or pointed at a deleted site reports
          # success forever while openavc.com is not rebuilt at all.
          if [ -z "$SITE_DEPLOY_HOOK" ]; then
            echo "SITE_DEPLOY_HOOK is not set, so openavc.com is not rebuilt at all." >&2
            exit 1
          fi
          curl -sS --fail-with-body -X POST "$SITE_DEPLOY_HOOK" \
            -w '\nbuild hook responded %{http_code}\n'
        env:
          SITE_DEPLOY_HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
