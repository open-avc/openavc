# OpenAVC Docker Compose - Multi-Room
#
# Each room gets its own container, port, and data volume.
# Add or remove rooms as needed.
#
# Start:   docker compose -f docker-compose.multi-room.yml up -d
# Update:  docker compose -f docker-compose.multi-room.yml pull && docker compose -f docker-compose.multi-room.yml up -d
#
# Bridge networking: each space needs its own port (8081/8082/8083), so the
# containers sit behind NAT on a private network. They still connect to and
# control your devices, added by IP address. They cannot hear the LAN or send
# to all of it: device discovery finds nothing, panel apps cannot find them on
# their own, Wake-on-LAN, Art-Net and sACN reach no device, and a device that
# sends its changes to OpenAVC reaches it only on a fixed port published below.
# To have those, run one space per computer with docker-compose.yml (host
# networking), or set up macvlan networking so each container gets its own
# LAN address.

services:
  room-101:
    image: ghcr.io/open-avc/openavc:latest
    container_name: openavc-room-101
    ports:
      - "8081:8080"
      # Enabling HTTPS in Settings? Publish the TLS port too (one unique
      # host port per room), e.g.:
      # - "8444:8443"
      # A device that sends its changes to a UDP port (SNMP traps, say)?
      # Publish that port with its protocol, the same number on both
      # sides, one port per room, e.g.:
      # - "162:162/udp"
    volumes:
      - room-101-data:/data
      # This computer's time zone, so schedules fire at local time (Linux).
      # To name a zone instead, delete this line and add:
      #   environment:
      #     TZ: America/Chicago
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

  room-102:
    image: ghcr.io/open-avc/openavc:latest
    container_name: openavc-room-102
    ports:
      - "8082:8080"
    volumes:
      - room-102-data:/data
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

  room-103:
    image: ghcr.io/open-avc/openavc:latest
    container_name: openavc-room-103
    ports:
      - "8083:8080"
    volumes:
      - room-103-data:/data
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

volumes:
  room-101-data:
  room-102-data:
  room-103-data:
