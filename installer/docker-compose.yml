# OpenAVC Docker Compose - Single Room
#
# Start:   docker compose up -d
# Stop:    docker compose down
# Update:  docker compose pull && docker compose up -d
# Logs:    docker compose logs -f

services:
  openavc:
    image: ghcr.io/open-avc/openavc:latest
    container_name: openavc
    # Host networking puts the container on your LAN, which device discovery,
    # mDNS, Wake-on-LAN and devices that send their changes to OpenAVC need.
    # Linux only: Docker Desktop for Windows or Mac runs the container in a
    # virtual machine that is not on your LAN, so use the native installer
    # there if you need any of those.
    network_mode: host
    # NET_RAW lets the unprivileged `openavc` user run ping for the
    # discovery sweep (the image's ping binary has the matching file
    # capability set).
    cap_add:
      - NET_RAW
    volumes:
      - openavc-data:/data
      # This computer's time zone, so schedules fire at local time (Linux).
      # To name a zone instead, delete this line and add:
      #   environment:
      #     TZ: America/Chicago
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    # For serial/USB device passthrough, uncomment:
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0

volumes:
  openavc-data:
