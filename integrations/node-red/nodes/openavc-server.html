<script src="resources/@open-avc/node-red-openavc/editor.js"></script>

<script type="text/javascript">
  RED.nodes.registerType("openavc-server", {
    category: "config",
    defaults: {
      name: { value: "" },
      host: { value: "", required: true },
      port: { value: 8080, required: true, validate: RED.validators.number() },
      tls: { value: false },
      tlsVerify: { value: false },
      tlsConfig: { type: "tls-config", required: false },
      clientName: { value: "" },
    },
    credentials: {
      apiKey: { type: "password" },
    },
    label: function () {
      return this.name || this.host + ":" + this.port;
    },
    oneditprepare: function () {
      const $tls = $("#node-config-input-tls");
      const $rows = $("#openavc-tls-verify-row, #openavc-tls-config-row");
      const sync = () => $rows.toggle($tls.is(":checked"));
      $tls.on("change", sync);
      sync();
    },
    oneditsave: function () {
      // An unticked HTTPS keeps no TLS configuration behind it.
      if (!$("#node-config-input-tls").is(":checked")) {
        $("#node-config-input-tlsConfig").val("");
      }
    },
  });
</script>

<script type="text/html" data-template-name="openavc-server">
  <div class="form-row">
    <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-config-input-name" placeholder="Room 201" />
  </div>
  <div class="form-row">
    <label for="node-config-input-host"><i class="fa fa-server"></i> Host</label>
    <input type="text" id="node-config-input-host" placeholder="192.168.1.50 or openavc.local" />
  </div>
  <div class="form-row">
    <label for="node-config-input-port"><i class="fa fa-plug"></i> Port</label>
    <input type="text" id="node-config-input-port" style="width: 100px" />
  </div>
  <div class="form-row">
    <label for="node-config-input-tls"><i class="fa fa-lock"></i> HTTPS</label>
    <input type="checkbox" id="node-config-input-tls" style="width: auto; vertical-align: middle" />
    <span style="margin-left: 6px">Connect over HTTPS (port 8443 by default)</span>
  </div>
  <div class="form-row" id="openavc-tls-verify-row">
    <label for="node-config-input-tlsVerify">&nbsp;</label>
    <input type="checkbox" id="node-config-input-tlsVerify" style="width: auto; vertical-align: middle" />
    <span style="margin-left: 6px">Verify the certificate (off for a self-signed certificate)</span>
  </div>
  <div class="form-row" id="openavc-tls-config-row">
    <label for="node-config-input-tlsConfig">&nbsp;</label>
    <input type="text" id="node-config-input-tlsConfig" />
    <div class="form-tips" style="margin-top: 4px">
      Optional. A TLS configuration carries a company CA certificate or a client certificate,
      and its own "Verify server certificate" setting applies.
    </div>
  </div>
  <div class="form-row">
    <label for="node-config-input-apiKey"><i class="fa fa-key"></i> API key</label>
    <input type="password" id="node-config-input-apiKey" placeholder="leave blank to connect as a panel" />
  </div>
  <div class="form-row">
    <label for="node-config-input-clientName"><i class="fa fa-heartbeat"></i> Announce as</label>
    <input type="text" id="node-config-input-clientName" placeholder="e.g. lobby-logic (optional)" />
  </div>
  <div class="form-tips">
    With a name here, OpenAVC keeps <code>system.integration.&lt;name&gt;.connected</code>
    true while this connection is up and false when it drops, so a panel light, a monitored
    reading or a trigger can tell when the flow is not there.
  </div>
  <div class="form-tips">
    Without an API key this connection can do what a panel can: read all state, send
    commands, run macros, write <code>var.*</code> variables and emit <code>custom.*</code>
    events. With one it can also write any state namespace and hear every event. Generate
    a key in the Programmer under Settings &rsaquo; Access.
  </div>
</script>

<script type="text/markdown" data-help-name="openavc-server">
One OpenAVC system. Every OpenAVC node points at one of these, and all the nodes on it share a single WebSocket connection that reconnects on its own. Two systems in one flow are two of these.

### Connecting

**Host** and **Port** are where the Programmer opens (`http://host:8080/programmer`). Tick **HTTPS** if the system has it enabled; leave **Verify the certificate** off for the self-signed certificate a system generates for itself, and on for a cloud-issued or company certificate. A company certificate signed by your own CA needs that CA: add a **TLS configuration** and put the CA certificate in it (its own "Verify server certificate" setting then applies).

### API key

Leave it blank and the connection joins as a **panel**: it reads all state, sends device commands, runs and cancels macros, writes `var.*` and `plugin.*` variables, and emits `custom.*` events. That is enough for a flow that acts as the room's logic.

Give it a key and the connection joins as the **Programmer**: everything above, plus writing any state namespace and hearing every event on the bus. Generate one in the Programmer under **Settings › Access** (a key needs a Programmer password set as well). It is stored as a Node-RED credential and never sent to the browser.

If the key is wrong, every node on this server shows **disconnected: the server refused the API key** and the Node-RED log says the same.

### Announce as

A flow that has become a space's logic is part of the space, and when it is down a panel button still takes the press and nothing answers. Give the connection a name and OpenAVC publishes `system.integration.<name>.connected`, `true` while the socket is open and `false` when it drops. Bind an LED to it, add it as a monitored reading with an alert, or put a trigger on it that runs a fallback macro. The name is lowercased and kept to letters, digits, `_` and `-`.

### Lookups in the editor

The device, command, macro and state key fields on the other nodes fill their lists from this system. That needs the server node to be **deployed** first, because the lookups go through its connection. Devices and state keys come from the live connection with or without a key; commands and macros are read over the REST API, which a password-protected system only answers with the key. The dialog says so, and typing the id works either way.

### Knowing the connection is up

Every OpenAVC node shows the connection on its status dot. A **status** node (from the palette's common section) turns those changes into messages, so a flow can react when the system goes away or comes back.
</script>
